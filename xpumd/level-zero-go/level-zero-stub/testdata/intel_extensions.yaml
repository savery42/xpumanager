# Driver with the Intel experimental extensions: info logs and driver scoped events.

Drivers:
  - ExtensionProperties:
      - Name: "ZES_intel_experimental_driver_info_logs"
        Version: 131072 # ZES_INTEL_DRIVER_INFO_LOGS_EXP_VERSION_2_0
      - Name: "ZES_intel_experimental_driver_event"
        Version: 65536 # ZES_INTEL_DRIVER_EVENT_EXP_VERSION_1_0
    Events: 65536 # ZES_INTEL_CPER_DATA_AVAILABLE
    Devices:
      # A device with a pending event and one without
      - Properties: {}
        Events: 1 # ZES_EVENT_TYPE_FLAG_DEVICE_DETACH
      - Properties: {}
    IntelInfoLogs:
      # A log with named instances and peek both supported
      - Properties:
          InfoLogType: 0 # ZES_INTEL_INFO_LOG_TYPE_EXP_DEVICE
          InfoLogFormat: 0 # ZES_INTEL_INFO_LOG_FORMAT_CPER
          IsNamedInstancedCollectionSupported: true
          IsPeekSupported: true
        BufferSizeInKb: 8  # reported as applied, whatever is requested
        Collection:
          # The status is handed out as configured, by both the read and the peek
          Status:
            DroppedRecordCount: 0
            IsDroppedRecordCountValid: true
            HasDataToRead: true
          Records:
            - Data: "CPER-RECORD-1"
              Address:
                Domain: 0
                Bus: 1
                Device: 2
                Function: 3
              Uuid:
                Id: "12345678-abcd-ef01-2345-6789abcdef01"
              Timestamp: 1234567
              RecordType: 2 # ZES_INTEL_INFO_LOG_RECORD_TYPE_EXP_ERROR_CORRECTED
            - Data: "CPER-RECORD-2"
              Address:
                Domain: 0
                Bus: 4
                Device: 5
                Function: 6
              Timestamp: 7654321
      # A log without the optional capabilities, reporting dropped records
      - Properties:
          IsNamedInstancedCollectionSupported: false
          IsPeekSupported: false
        Collection:
          Status:
            DroppedRecordCount: 5
            IsDroppedRecordCountValid: true
          Records:
            - Data: "CPER-RECORD-3"
      # A log that hands out nothing (a null collection)
      - Properties: {}
        Collection: null
