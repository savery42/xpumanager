# Error stub: component method failures (DriverGet and EnumInfoLogs succeed).

Drivers:
  - ExtensionProperties:
      - Name: "ZES_intel_experimental_driver_info_logs"
        Version: 131072 # ZES_INTEL_DRIVER_INFO_LOGS_EXP_VERSION_2_0

    Devices:
      - Properties: {}

    IntelInfoLogs:
      - ReturnValues:
          zesIntelInfoLogGetPropertiesExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
          zesIntelInfoLogCreateInstanceExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
      # InfoLog where creating a collection instance succeeds so that the failures of the instance methods can be reached
      - Properties: {}
        ReturnValues:
          zesIntelInfoLogInstanceReadWithMetadataExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
          zesIntelInfoLogInstancePeekWithMetadataExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
          zesIntelInfoLogInstanceDeleteExp: 0x70010000 # ZE_RESULT_ERROR_INSUFFICIENT_PERMISSIONS
